[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egx-calendar"
version = "0.2.0"
description = "Self-maintaining, vendor-agnostic trading calendar for the Egyptian Exchange (EGX)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "hijridate>=2.3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
anthropic = ["anthropic>=0.100"]
dev = ["pytest>=7.0", "pandas>=2.0", "anthropic>=0.100"]

[tool.hatch.build.targets.wheel]
packages = ["src/egx_calendar"]

[project.scripts]
egx-update = "egx_calendar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
